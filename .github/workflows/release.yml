name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # gorelease is deliberately NOT used here. It authenticates through
      # tinywasm/keyring, and a GitHub runner has no credential store, so it
      # fails with "keyring: credential store unavailable" no matter what token
      # is exported. gorelease is a developer-machine tool; in CI the native
      # path is the runner's own token plus gh.
      - name: Build the release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/goflare-${os}-${arch}" ./cmd/goflare
          done
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes
          fi

      - name: Move the v1 tag
        run: |
          set -euo pipefail
          git tag -f v1 "${GITHUB_SHA}"
          git push origin -f v1
